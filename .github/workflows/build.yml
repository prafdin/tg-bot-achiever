name: Test and build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACHIEVER_ENV_FILE: .env.example
      IMAGE: tg-bot-achiever-achiever:latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run tests
        run: |
          python -m pip install '.[test]'
          python -m pytest -q
      - name: Validate Compose
        run: docker compose config -q
      - name: Check Docker build
        if: github.ref != 'refs/heads/main'
        run: docker build --tag "$IMAGE" .
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish container image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:build-$GITHUB_RUN_ID"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            printf 'Image already published for run %s\n' "$GITHUB_RUN_ID"
            exit 0
          fi
          docker build --tag "$image" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=build-$GITHUB_RUN_ID" .
          docker push "$image"
