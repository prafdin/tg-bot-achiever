name: Test and build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACHIEVER_ENV_FILE: .env.example
      IMAGE: tg-bot-achiever-achiever:latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run tests
        run: |
          python -m pip install '.[test]'
          python -m pytest -q
      - name: Validate Compose and build image
        run: |
          docker compose config -q
          docker build --tag "$IMAGE" .
      - name: Export deployment image
        if: github.ref == 'refs/heads/main'
        run: docker save "$IMAGE" | gzip -1 > achiever-image.tar.gz
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: achiever-image
          path: achiever-image.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: achiever-image
      - name: Publish build for deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_RUN_ID"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" achiever-image.tar.gz --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Build $GITHUB_RUN_ID" --prerelease --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "achiever-image.tar.gz") | .name' \
            | grep -Fx achiever-image.tar.gz
