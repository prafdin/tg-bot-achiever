name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version from pyproject.toml (for example 0.1.0)
        required: true
        type: string
      run_id:
        description: Successful main build tested on stage
        required: true
        type: string

concurrency:
  group: app-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Promote tested image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash .github/scripts/release.sh
